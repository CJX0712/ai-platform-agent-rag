services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ai-platform-agent-rag:0.1.0
    container_name: ai-platform-api
    ports:
      - "8000:8000"
    env_file:
      # 未创建 .env 时不阻断启动，全部走默认配置（mock 模型，可直接验证链路）
      - path: ../.env
        required: false
    environment:
      APP_CHROMA_PATH: /app/data/chroma
      APP_DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
