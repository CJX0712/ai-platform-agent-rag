name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖（锁定版本）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: 静态检查
        run: python -m ruff check ai_platform apps tests scripts

      - name: 单元测试
        env:
          PYTHONPATH: ${{ github.workspace }}
          APP_LLM_PROVIDER: mock
          APP_EMBEDDING_PROVIDER: hash
        run: python -m pytest tests -q

      - name: 端到端冒烟
        env:
          PYTHONPATH: ${{ github.workspace }}
          APP_LLM_PROVIDER: mock
          APP_EMBEDDING_PROVIDER: hash
        run: |
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 &
          python scripts/e2e_check.py

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t ai-platform-agent-rag:ci .
