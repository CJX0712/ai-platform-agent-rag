<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Platform · Agent + RAG</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --text-muted: #9aa3b2;
    --accent: #16a34a;
    --accent-2: #2563eb;
    --danger: #dc2626;
    --radius: 12px;
    --font: "Inter", "Noto Sans SC", -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header .logo {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--surface-2);
    display: grid; place-items: center;
    border: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .sub { color: var(--text-muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .badge {
    font-size: 11px; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px;
  }
  .icon-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; width: 34px; height: 34px;
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-2); }
  main { flex: 1; display: flex; min-height: 0; }
  .chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; max-width: 820px; }
  .msg .ava { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; flex-shrink: 0; }
  .msg .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .bubble { background: var(--surface-2); }
  .ctx { font-size: 12px; color: var(--text-muted); border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 8px; }
  .ctx summary { cursor: pointer; }
  .composer { border-top: 1px solid var(--border); padding: 14px 20px; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 11px 14px; font-family: var(--font); font-size: 14px;
  }
  textarea:focus { outline: none; border-color: var(--accent-2); }
  .send {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
    padding: 0 18px; height: 44px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .send:disabled { opacity: 0.5; cursor: not-allowed; }
  aside {
    width: 320px; border-left: 1px solid var(--border); background: var(--surface);
    padding: 18px; overflow-y: auto; display: none; flex-direction: column; gap: 14px;
  }
  aside.open { display: flex; }
  aside h2 { font-size: 13px; margin: 0 0 4px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  aside label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; }
  aside input, aside textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: var(--font);
  }
  .ghost { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .ghost:hover { background: var(--surface-2); }
  .muted { color: var(--text-muted); font-size: 12px; }
  .err { color: var(--danger); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg>
  </div>
  <div>
    <h1>AI Platform</h1>
    <div class="sub">Agent 编排 + RAG 知识库</div>
  </div>
  <div class="spacer"></div>
  <span class="badge" id="status">连接中…</span>
  <button class="icon-btn" id="toggleSettings" title="设置" aria-label="设置">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>
<main>
  <section class="chat">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send" id="send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        发送
      </button>
    </div>
  </section>
  <aside id="settings">
    <h2>连接设置</h2>
    <div>
      <label>API 地址</label>
      <input id="apiBase" value="" placeholder="http://localhost:8000" />
    </div>
    <div>
      <label>使用 WebSocket（实时）</label>
      <label style="display:flex;gap:6px;align-items:center;color:var(--text)"><input type="checkbox" id="useWs" /> 启用 /ws/chat</label>
    </div>
    <h2>知识库摄取</h2>
    <div>
      <label>文档标题</label>
      <input id="docTitle" placeholder="示例文档" />
    </div>
    <div>
      <label>文本正文</label>
      <textarea id="docText" rows="5" placeholder="粘贴一段知识库文本，点击摄取后可用于 RAG 检索"></textarea>
    </div>
    <button class="ghost" id="ingest">摄取到知识库</button>
    <div class="muted" id="ingestMsg"></div>
    <h2>工具</h2>
    <div class="muted" id="toolsList">加载中…</div>
  </aside>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  function apiBase() {
    const v = $("apiBase").value.trim().replace(/\/+$/, "");
    return v || "http://localhost:8000";
  }
  function avatar(role) {
    if (role === "user") {
      return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
    }
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M12 8v8"/></svg>';
  }
  function addMsg(role, text, context) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    let html = '<div class="ava">' + avatar(role) + "</div>";
    html += '<div class="bubble">' + escapeHtml(text);
    if (context && context.length) {
      html += '<details class="ctx"><summary>检索到的知识片段（' + context.length + '）</summary>' +
        context.map((c) => "<div>• " + escapeHtml(c) + "</div>").join("") + "</details>";
    }
    html += "</div>";
    el.innerHTML = html;
    $("messages").appendChild(el);
    $("messages").scrollTop = $("messages").scrollHeight;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  let convId = null;
  async function send() {
    const text = $("input").value.trim();
    if (!text) return;
    addMsg("user", text);
    $("input").value = "";
    $("send").disabled = true;
    try {
      if ($("useWs").checked) {
        await sendWs(text);
      } else {
        const resp = await fetch(apiBase() + "/v1/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, conv_id: convId }),
        });
        const data = await resp.json();
        convId = data.conv_id;
        addMsg("assistant", data.answer, data.context);
      }
    } catch (e) {
      addMsg("assistant", "请求失败：" + e.message, null);
    } finally {
      $("send").disabled = false;
    }
  }
  function sendWs(text) {
    return new Promise((resolve, reject) => {
      const ws = new WebSocket(apiBase().replace(/^http/, "ws") + "/ws/chat");
      ws.onopen = () => ws.send(JSON.stringify({ message: text, conv_id: convId }));
      ws.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        convId = data.conv_id;
        addMsg("assistant", data.answer, data.context);
        ws.close();
        resolve();
      };
      ws.onerror = () => reject(new Error("WebSocket 连接错误"));
    });
  }
  async function ingest() {
    const text = $("docText").value.trim();
    if (!text) { $("ingestMsg").textContent = "请先填写文本"; return; }
    try {
      const resp = await fetch(apiBase() + "/v1/ingest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, title: $("docTitle").value || "未命名" }),
      });
      const data = await resp.json();
      $("ingestMsg").textContent = "已摄取，切片数：" + data.chunks;
      $("docText").value = "";
    } catch (e) {
      $("ingestMsg").textContent = "摄取失败：" + e.message;
    }
  }
  async function loadMeta() {
    try {
      const h = await fetch(apiBase() + "/health").then((r) => r.json());
      $("status").textContent = "在线 · " + h.llm_provider + (h.auth_enabled ? " · 鉴权" : " · 匿名");
      const tools = await fetch(apiBase() + "/v1/tools").then((r) => r.json());
      $("toolsList").innerHTML = tools.map((t) => "<div><b>" + escapeHtml(t.name) + "</b> — " + escapeHtml(t.description) + "</div>").join("");
    } catch (e) {
      $("status").textContent = "离线";
    }
  }
  $("send").addEventListener("click", send);
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $("toggleSettings").addEventListener("click", () => $("settings").classList.toggle("open"));
  $("ingest").addEventListener("click", ingest);
  loadMeta();
  addMsg("assistant", "你好，我是 AI Platform 助手。可向我提问；若开启真实模型并摄取知识库，我会基于检索内容作答。");
</script>
</body>
</html>
